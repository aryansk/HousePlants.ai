name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project HousePlants.xcodeproj \
            -scheme HousePlants \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing HousePlantsTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
